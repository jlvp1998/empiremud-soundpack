# Every time the soundpack changes, this puts two files on the repository's
# download page:
#   empiremud-soundpack.zip - the whole soundpack, for new players
#   manifest.txt - the list of files and their fingerprints, which players'
#                  soundpacks read to find out what changed
name: Make the download zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# never run two at once
concurrency: download-zip

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: empiremud-soundpack
          fetch-depth: 200  # the change descriptions in manifest.txt come from the history
      # MUSHclient's own settings files aren't kept in git (they change every
      # time someone plays), so the zip gets the clean copies from defaults
      - name: Put the default MUSHclient settings in place
        run: cp -r empiremud-soundpack/defaults/. empiremud-soundpack/
      - name: Make empiremud-soundpack.zip
        run: >
          zip -q -r -X empiremud-soundpack.zip empiremud-soundpack
          -x 'empiremud-soundpack/.git/*' 'empiremud-soundpack/.github/*' 'empiremud-soundpack/defaults/*'
          'empiremud-soundpack/.gitignore' 'empiremud-soundpack/.gitattributes'
      - name: Make manifest.txt
        working-directory: empiremud-soundpack
        run: |
          {
            echo "commit $GITHUB_SHA"
            find worlds/empire -type f ! -path 'worlds/empire/updater/version.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's/^\([0-9a-f]*\)  /\1 /'
            # each change, newest first, so players hear what's new; changes
            # that don't reach players (outside worlds/empire) have no words
            empire=$(git log -200 --format=%H -- worlds/empire)
            git log -200 --format='%H %s' | while read -r sha subject; do
              if echo "$empire" | grep -q "$sha"; then echo "change $sha $subject"; else echo "change $sha"; fi
            done
          } > ../manifest.txt
          head -3 ../manifest.txt
      - name: Put them on the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soundpack --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create soundpack --repo "$GITHUB_REPOSITORY" --title "EmpireMUD soundpack" --notes "Download empiremud-soundpack.zip, unzip it, open the empiremud-soundpack folder, and run MUSHclient.exe."
          gh release upload soundpack empiremud-soundpack.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload soundpack manifest.txt --repo "$GITHUB_REPOSITORY" --clobber
